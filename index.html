
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Santa :)</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.smileys {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.face {
    position: absolute;
    width: var(--size);
    height: var(--size);
    left: var(--x);
    top: var(--y);
    background: #ffff00;
    border: 4px solid black;
    border-radius: 48% 52% 45% 55%;
    transform: rotate(var(--rotation));
}

.face::before {
    content: "";
    position: absolute;
    left: 25%;
    top: 28%;
    width: 9%;
    height: 17%;
    background: black;
    border-radius: 50%;
    box-shadow: calc(var(--size) * .35) 0 black;
}

.face::after {
    content: "";
    position: absolute;
    left: 24%;
    top: 48%;
    width: 48%;
    height: 25%;
    border-bottom: 4px solid black;
    border-radius: 50%;
}

.card {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    background: transparent;
}

.card h1 {
    font-size: clamp(32px, 6vw, 65px);
}

.card h2 {
    font-size: clamp(25px, 5vw, 48px);
}

.card p {
    font-size: 20px;
}

@media (max-width: 600px) {
    .face {
        border-width: 3px;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="smileys">

<span class="face" style="--x:2%;--y:3%;--size:100px;--rotation:-12deg"></span>
<span class="face" style="--x:23%;--y:5%;--size:55px;--rotation:8deg"></span>
<span class="face" style="--x:42%;--y:2%;--size:85px;--rotation:-5deg"></span>
<span class="face" style="--x:68%;--y:4%;--size:105px;--rotation:12deg"></span>
<span class="face" style="--x:88%;--y:3%;--size:95px;--rotation:-8deg"></span>

<span class="face" style="--x:5%;--y:29%;--size:65px;--rotation:10deg"></span>
<span class="face" style="--x:91%;--y:25%;--size:55px;--rotation:-9deg"></span>
<span class="face" style="--x:3%;--y:45%;--size:90px;--rotation:7deg"></span>
<span class="face" style="--x:87%;--y:39%;--size:85px;--rotation:-12deg"></span>
<span class="face" style="--x:94%;--y:54%;--size:75px;--rotation:8deg"></span>

<span class="face" style="--x:1%;--y:69%;--size:115px;--rotation:-10deg"></span>
<span class="face" style="--x:19%;--y:81%;--size:65px;--rotation:12deg"></span>
<span class="face" style="--x:34%;--y:70%;--size:90px;--rotation:-7deg"></span>
<span class="face" style="--x:48%;--y:88%;--size:55px;--rotation:8deg"></span>
<span class="face" style="--x:64%;--y:76%;--size:85px;--rotation:-5deg"></span>
<span class="face" style="--x:79%;--y:84%;--size:65px;--rotation:10deg"></span>
<span class="face" style="--x:89%;--y:72%;--size:110px;--rotation:-8deg"></span>

<span class="face" style="--x:17%;--y:20%;--size:45px;--rotation:5deg"></span>
<span class="face" style="--x:76%;--y:19%;--size:50px;--rotation:-5deg"></span>
<span class="face" style="--x:12%;--y:58%;--size:40px;--rotation:12deg"></span>
<span class="face" style="--x:57%;--y:8%;--size:40px;--rotation:-10deg"></span>

</div>

<div class="card">
    <h1> Secret Santa</h1>
    <p>Welcome to our Secret Santa!</p>
    <p>Your Christmas surprise awaits...</p>
</div>

<script src="script.js"></script>

</body>
</html>
